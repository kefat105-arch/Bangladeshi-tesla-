<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <radialGradient id="sunGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Red Sun Circle (Bangladesh flag motif) -->
  <circle cx="256" cy="235" r="140" fill="url(#sunGrad)" />

  <!-- Stylized CNG & Rickshaw Silhouette with Skateboarder -->
  <!-- Road Horizon lines -->
  <path d="M 96 390 L 416 390" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 130 420 L 382 420" stroke="#f8fafc" stroke-width="6" stroke-dasharray="18 14" stroke-linecap="round" />
  <path d="M 160 450 L 352 450" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Skateboard & Rider Stylized Gold Emblem -->
  <g transform="translate(256, 230) scale(1.15)">
    <!-- Speed Motion trails -->
    <path d="M -90 -20 L -40 -20" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M -110 5 L -55 5" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M -85 30 L -35 30" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Skateboard Deck -->
    <path d="M -60 70 Q 0 85 60 70 Q 75 66 70 60 Q 60 62 0 74 Q -60 62 -70 60 Q -75 66 -60 70 Z" fill="#ffffff" />
    <circle cx="-38" cy="84" r="10" fill="url(#goldGrad)" />
    <circle cx="38" cy="84" r="10" fill="url(#goldGrad)" />

    <!-- Skateboarder Head -->
    <circle cx="20" cy="-60" r="18" fill="#ffffff" />
    <!-- Cap Brim -->
    <path d="M 24 -66 L 46 -60 L 34 -52 Z" fill="url(#goldGrad)" />
    <!-- Torso leaning forward -->
    <path d="M 14 -42 L -12 0 L 10 5 L 26 -38 Z" fill="#ffffff" />
    <!-- Arms riding pose -->
    <path d="M 22 -35 L 50 -15 L 65 -25" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 14 -35 L -25 -25 L -55 -40" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Bent Legs on Deck -->
    <path d="M 0 0 L 30 25 L 36 65" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M -6 0 L -30 28 L -36 65" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Bengali Typography Accent -->
  <text x="256" y="492" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#fef08a" letter-spacing="4">বাংলাদেশ রাইড</text>
</svg>
